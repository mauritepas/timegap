[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mauritepas-timegap"
version = "0.1.0"
description = "先把时间戳归一化，再计算时间差"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mauritepas" }]
keywords = ["time", "timestamp", "duration", "iso8601"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mauritepas/timegap"
Repository = "https://github.com/mauritepas/timegap"
Issues = "https://github.com/mauritepas/timegap/issues"

[project.scripts]
timegap = "timegap:main"

[tool.setuptools]
py-modules = ["timegap"]
